spring.application.name=Localy

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/localydb
spring.datasource.username=localyuser
spring.datasource.password=localysecret
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# JWT
jwt.secret=9o2vYvK9Zxq1r3Td5u6N8sV0wYfGhJkLmN4OpQrStUsdsa
jwt.expirationMillis=3600000

# MQTT
mqtt.brokerUrl=tcp://localhost:1883
mqtt.clientId=localy-client-${random.value}
mqtt.topic.user.update=user/update
mqtt.topic.user.info=user/info
