version: '3.8'
services:
  localy_postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: localydb
      POSTGRES_USER: localyuser
      POSTGRES_PASSWORD: localysecret
    ports: ["5432:5432"]
    volumes: ["localy_pgdata:/var/lib/postgresql/data"]

  auth_postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authsecret
    ports: ["5433:5432"]
    volumes: ["auth_pgdata:/var/lib/postgresql/data"]

  mqtt_broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

volumes:
  localy_pgdata:
  auth_pgdata:
